# Its own workspace, like the frontend spike, and deliberately on *stable*.
# The arena, the gates, the generation table and relocation application need
# nothing from rustc: they are ordinary systems code. Only the cg_clif half of
# R1 needs a nightly, and keeping the two apart means a broken nightly cannot
# stop the runtime measurements.
[workspace]

[package]
name = "live-r1"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
