[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/hashing",
    "crates/cache",
    "crates/differential",
    "crates/corpus",
    "crates/archive",
    "crates/layout",
    "crates/link",
    "crates/macho",
    "crates/output",
    "crates/relocations",
    "crates/symbols",
    "crates/tbd",
    "crates/arguments",
    "crates/diagnostics",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blinker-arguments = { path = "crates/arguments" }
blinker-cache = { path = "crates/cache" }
blinker-diagnostics = { path = "crates/diagnostics" }
blinker-hashing = { path = "crates/hashing" }
blinker-differential = { path = "crates/differential" }
blinker-archive = { path = "crates/archive" }
blinker-layout = { path = "crates/layout" }
blinker-link = { path = "crates/link" }
blinker-macho = { path = "crates/macho" }
blinker-output = { path = "crates/output" }
blinker-relocations = { path = "crates/relocations" }
blinker-symbols = { path = "crates/symbols" }
blinker-tbd = { path = "crates/tbd" }
blinker-test-support = { path = "crates/test-support" }


blake3 = "1"
libc = "0.2"
object = { version = "0.36", default-features = false, features = ["read_core", "macho", "archive", "std"] }
serde = { version = "1", features = ["derive", "rc"] }
sha2 = "0.10"
serde_json = "1"
yaml-rust2 = "0.8"

# The release profile is part of the product, not a build detail.
#
# There was none, which meant cargo's defaults: sixteen codegen units, no
# cross-crate inlining, and a 1.9 MB binary carrying its symbol table. Two
# separate costs came out of that, and they are paid at different times.
#
# The one that is easy to see is codegen. blinker is fifteen crates and the hot
# paths cross them constantly — `relocations::apply` is called from `link`, per
# relocation, 87,545 times a link. Without LTO none of that inlines.
#
# The one that is easy to miss is *startup*. rustc spawns a linker per crate,
# so every link pays `execve` plus dyld's fixups over the whole image before
# `main` runs. Against a 16 KB no-op process, blinker's spawn cost above that
# floor fell from 2.48 ms to 1.13 ms when LTO took the binary from 1.9 MB to
# 1.3 MB.
#
# What dyld charges for is *fixups*, not file length — see finding 126. Adding
# `panic = "abort"` on top removed another 130 KB of unwind tables and changed
# the spawn cost by nothing, because nothing reads an unwind table until
# something unwinds. LTO helped because it deleted cross-crate symbols and
# relocations, which are exactly what dyld must resolve.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
