[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/arguments",
    "crates/diagnostics",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blinker-arguments = { path = "crates/arguments" }
blinker-diagnostics = { path = "crates/diagnostics" }
blinker-test-support = { path = "crates/test-support" }

blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
