name: release

# Tag a version, get a binary people can install without a Rust toolchain:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The artifact name is fixed rather than versioned, because `install.sh` fetches
# it through the `/releases/latest/download/` redirect and a name carrying the
# version would need the installer to know the version before it can ask what
# the version is.
on:
  push:
    tags: ["v*"]
  # So a release can be cut by hand from a tag that already exists.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      # The gate, again, on the exact commit being released. A tag is the one
      # place where "it passed on master" is not good enough: what people
      # download is this build, not that one.
      - name: gate
        run: ./scripts/check.sh

      - name: build
        run: cargo build --release --locked

      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/blinker dist/
          cd dist
          # `blinker --blinker-version` is recorded beside the binary so a
          # downloaded copy can be identified without running it.
          ./blinker --blinker-version > VERSION
          tar -czf blinker-aarch64-apple-darwin.tar.gz blinker
          shasum -a 256 blinker-aarch64-apple-darwin.tar.gz \
            > blinker-aarch64-apple-darwin.tar.gz.sha256

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/blinker-aarch64-apple-darwin.tar.gz \
            dist/blinker-aarch64-apple-darwin.tar.gz.sha256
